<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rime 外觀設計器</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><b>Rime 外觀設計器</b><span id="envchip" class="chip">連接中…</span></div>
  <div class="actions">
    <div class="ibtns">
      <button id="btnUndo" class="ibtn" title="撤銷(⌘Z)" aria-label="撤銷" disabled><svg viewBox="0 0 20 20"><path d="M7.5 5.5 4 9l3.5 3.5M4.5 9H12a4 4 0 0 1 0 8h-2"/></svg></button>
      <button id="btnRedo" class="ibtn" title="重做(⇧⌘Z)" aria-label="重做" disabled><svg viewBox="0 0 20 20"><path d="M12.5 5.5 16 9l-3.5 3.5M15.5 9H8a4 4 0 0 0 0 8h2"/></svg></button>
    </div>
    <button id="btnBackups" class="btn" title="歷史版本、基幹版本與回收站"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/></svg>備份</button>
    <button id="btnMore" class="btn icon" title="更多" aria-label="更多"><svg class="ico" viewBox="0 0 20 20"><circle cx="5" cy="10" r=".6"/><circle cx="10" cy="10" r=".6"/><circle cx="15" cy="10" r=".6"/></svg></button>
    <button id="btnApply" class="btn primary" title="寫入配置並讓鼠鬚管重新部署(⌘S)"><span class="dot"></span><span class="lbl">套用並部署</span></button>
  </div>
</header>

<div id="app" hidden>
<main>
  <aside class="left" id="left">
    <section class="card pv">
      <div class="pvhead">
        <div class="seg" id="modeSeg" title="預覽淺色還是深色模式下的樣子">
          <button data-m="light"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>淺色</button>
          <button data-m="dark"><svg class="ico" viewBox="0 0 20 20"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg>深色</button>
        </div>
        <span class="grow"></span>
        <select id="sampleSel" title="換一句示例"></select>
        <button id="btnCompare" class="btn small" title="按住不放:看改動之前(目前磁盤上的配置)的樣子" disabled>按住對比</button>
      </div>
      <div class="stage" id="stage">
        <div class="fakewin">
          <div class="dots"><i></i><i></i><i></i></div>
          <div><span id="fakeBefore"></span><span class="pre" id="fakePre"></span><span class="dim" id="fakeCaret">|</span></div>
        </div>
        <div class="panelslot" id="preview"></div>
        <div class="stagebadge" id="stageBadge" hidden></div>
      </div>
      <div class="pvhint">點預覽裏的候選可切換高亮。預覽照鼠鬚管的排版規則繪製,字體渲染等細節以部署後的實際效果為準。</div>
    </section>
    <section class="card look" id="lookCard"></section>
    <section class="card modecard" id="modeCard"></section>
  </aside>

  <section class="right">
    <nav class="tabs" id="tabs">
      <button data-t="themes" class="on">主題</button>
      <button data-t="style">字體與版式</button>
      <button data-t="colors">配色</button>
      <button data-t="cand">候選與序號</button>
    </nav>
    <div class="pane on" id="pane-themes"></div>
    <div class="pane" id="pane-style"></div>
    <div class="pane" id="pane-colors"></div>
    <div class="pane" id="pane-cand"></div>
  </section>
</main>
</div>

<div id="fatal" class="fatal" hidden></div>
<div class="modal" id="modal" hidden><div class="dlg" id="dlg"></div></div>
<div id="menuLayer"></div>
<div id="toasts"></div>
<datalist id="fontlist"></datalist>

<script>
const __TOKEN = '__TOKEN__';
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
